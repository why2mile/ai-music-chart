ot">경남 18개 시·군과 창원시 진해구를 선택할 수 있습니다. 인기·추천 순위는 실제 매출 순위와 구분해 제공합니다.</div></main><footer>우리동네 TOP100 · 경남 생활 정보 플랫폼</footer><script>let r='',c='';const $=s=>document.querySelector(s);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{r=b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('active',x===b));$('#sel').innerHTML='<b>'+r+' 선택됨</b> · 이제 업종을 선택하세요.';update()});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{c=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('active',x===b));update()});function update(){let g=$('#go');g.disabled=!(r&&c);g.textContent=r&&c?r+' '+c+' 인기순위 보기 →':'지역과 업종을 먼저 선택하세요 →'}$('#go').onclick=()=>{if(r&&c)alert(r+' '+c+' 순위 페이지를 준비하고 있습니다.')};</script></body></html>
